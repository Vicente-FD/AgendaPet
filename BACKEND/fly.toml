# Despliegue en Fly.io, región São Paulo (la más cercana a Chile con Supabase).
#   fly launch --no-deploy        (una sola vez, crea la app)
#   fly secrets set DATABASE_URL=... JWT_ACCESS_SECRET=... (ver docs/DESPLIEGUE.md)
#   fly deploy
app = "agendapet-api"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"
  NODE_ENV = "production"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
